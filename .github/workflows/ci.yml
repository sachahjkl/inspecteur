name: CI

# Every push to main and every pull request: inspecteurtool check (odin check -vet of the program and the tool, the unit tests,
# a release build), then inspecteurtool live (the real program in a headless sway: the window
# over the DevTools protocol, rendered by Mesa's lavapipe). The program is kept as an artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    # the flake's development shell (nix develop), as on a developer's machine: Odin, cargo, sway, Mesa's lavapipe, from the
    # NixOS cache, no distribution's package mirror in the way. On the runner itself, not in a container: the live test reads
    # the system's processes and its systemd services, and sway will not start as root.
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # (the toolkit's text library: cargo's target directory, keyed by its sources)
      - uses: actions/cache@v4
        with:
          path: ext/gui_toolkit/build/text
          key: text-linux-nix-${{ hashFiles('ext/gui_toolkit/native/text/**', 'flake.lock') }}

      # (the shell's dbus reads its session bus's configuration where NixOS keeps it, /etc/dbus-1, which this runner does not
      # have: a session bus of its own for sway's dbus-run-session)
      - name: dbus's session configuration
        run: |
          sudo mkdir -p /etc/dbus-1
          sudo tee /etc/dbus-1/session.conf >/dev/null <<'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF

      # (Vulkan's drivers are in /run/opengl-driver on NixOS: here, Mesa's software one from the flake's nixpkgs)
      - name: lavapipe
        run: |
          mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa | head -1)"
          echo "VK_DRIVER_FILES=$(find "$mesa" -name 'lvp_icd*.json' | head -1)" >> "$GITHUB_ENV"

      - name: inspecteurtool check, live
        run: |
          nix develop --command sh -c '
            set -e
            mkdir -p build
            odin build tools/inspecteurtool -collection:gt=ext/gui_toolkit/src -out:build/inspecteurtool -vet
            build/inspecteurtool check
            build/inspecteurtool live --keep
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspecteur-linux-x64-${{ github.sha }}
          path: |
            build/inspecteur
            build/live/*.log
            build/live/*.png
          if-no-files-found: warn

