name: CI

# Every push to master and every pull request:
# - Linux: inspecteurtool check (odin check -vet for Linux, Windows and macOS, unit tests, release build), then inspecteurtool live.
# - Windows: inspecteurtool.exe check (odin check -vet, src and src/winapi unit tests on live Win32/NT APIs, release build, console launcher and icon resource check).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    # the flake's development shell (nix develop), as on a developer's machine: Odin, cargo, sway, Mesa's lavapipe, from the
    # NixOS cache, no distribution's package mirror in the way. On the runner itself, not in a container: the live test reads
    # the system's processes and its systemd services, and sway will not start as root.
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # (the toolkit's text library: cargo's target directory and the crates it was built from, keyed by its sources. The
      # crates too: with the library restored, cargo fetches nothing, and the notices' `cargo metadata --offline` reads them)
      - uses: actions/cache@v4
        with:
          path: |
            ext/gui_toolkit/build/text
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: text-cargo-linux-nix-${{ hashFiles('ext/gui_toolkit/native/text/**', 'flake.lock') }}

      # (the shell's dbus reads its session bus's configuration where NixOS keeps it, /etc/dbus-1, which this runner does not
      # have: a session bus of its own for sway's dbus-run-session)
      - name: dbus's session configuration
        run: |
          sudo mkdir -p /etc/dbus-1
          sudo tee /etc/dbus-1/session.conf >/dev/null <<'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF

      # (Vulkan's drivers are in /run/opengl-driver on NixOS: here, Mesa's software one from the flake's nixpkgs)
      - name: lavapipe
        run: |
          mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa | head -1)"
          echo "VK_DRIVER_FILES=$(find "$mesa" -name 'lvp_icd*.json' | head -1)" >> "$GITHUB_ENV"

      - name: inspecteurtool check, live
        run: |
          nix develop --command sh -c '
            set -e
            mkdir -p build
            odin build tools/inspecteurtool -collection:gt=ext/gui_toolkit/src -out:build/inspecteurtool -vet
            build/inspecteurtool check
            build/inspecteurtool live --keep
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspecteur-linux-x64-${{ github.sha }}
          path: |
            build/inspecteur
            build/live/*.log
            build/live/*.png
          if-no-files-found: warn

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./ext/gui_toolkit/.github/actions/setup-odin

      - name: inspecteurtool check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin build tools/inspecteurtool -collection:gt=ext/gui_toolkit/src -out:build/inspecteurtool.exe -vet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/inspecteurtool.exe check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspecteur-windows-x64-${{ github.sha }}
          path: |
            build/inspecteur.exe
            build/inspecteur.com
          if-no-files-found: warn
